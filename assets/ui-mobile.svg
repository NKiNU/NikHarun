<svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="400" fill="#F2F4EE"/>
  <!-- status bar -->
  <rect x="0" y="0" width="200" height="30" fill="#ffffff"/>
  <circle cx="100" cy="15" r="4" fill="#CDD3CB"/>
  <!-- header -->
  <text x="18" y="66" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#14201C">Good morning</text>
  <text x="18" y="86" font-family="Inter,Arial" font-size="12" fill="#7E8A84">Nik, here's today</text>
  <circle cx="176" cy="66" r="14" fill="#2440C4"/>
  <!-- balance card -->
  <rect x="18" y="104" width="164" height="86" rx="16" fill="#14201C"/>
  <text x="34" y="134" font-family="Inter,Arial" font-size="10" fill="#B3BAB2">Balance</text>
  <text x="34" y="162" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#ffffff">$ 4,820</text>
  <rect x="34" y="172" width="40" height="8" rx="4" fill="#2440C4"/>
  <rect x="80" y="172" width="24" height="8" rx="4" fill="#4E9A6B"/>
  <!-- quick actions -->
  <g>
    <rect x="18" y="206" width="48" height="48" rx="14" fill="#ffffff"/>
    <rect x="76" y="206" width="48" height="48" rx="14" fill="#ffffff"/>
    <rect x="134" y="206" width="48" height="48" rx="14" fill="#ffffff"/>
    <circle cx="42" cy="230" r="9" fill="#2440C4"/>
    <circle cx="100" cy="230" r="9" fill="#2440C4"/>
    <circle cx="158" cy="230" r="9" fill="#4E9A6B"/>
  </g>
  <!-- list -->
  <g font-family="Inter,Arial">
    <rect x="18" y="270" width="164" height="40" rx="12" fill="#ffffff"/>
    <circle cx="40" cy="290" r="10" fill="#D8DEF7"/>
    <rect x="58" y="284" width="70" height="7" rx="3.5" fill="#212D28"/>
    <rect x="58" y="296" width="44" height="6" rx="3" fill="#C9CFC7"/>
    <rect x="18" y="316" width="164" height="40" rx="12" fill="#ffffff"/>
    <circle cx="40" cy="336" r="10" fill="#D7E7DC"/>
    <rect x="58" y="330" width="86" height="7" rx="3.5" fill="#212D28"/>
    <rect x="58" y="342" width="40" height="6" rx="3" fill="#C9CFC7"/>
  </g>
  <!-- tab bar -->
  <rect x="0" y="372" width="200" height="28" fill="#ffffff"/>
  <circle cx="50" cy="386" r="4" fill="#2440C4"/>
  <circle cx="100" cy="386" r="4" fill="#C9CFC7"/>
  <circle cx="150" cy="386" r="4" fill="#C9CFC7"/>
</svg>

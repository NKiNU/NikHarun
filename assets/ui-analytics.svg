<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" font-family="Inter,Arial">
  <rect width="320" height="220" fill="#ffffff"/>
  <rect x="0" y="0" width="320" height="40" fill="#EDEFE8"/>
  <text x="18" y="26" font-size="14" font-weight="700" fill="#14201C">Analytics</text>
  <rect x="238" y="12" width="66" height="18" rx="9" fill="#ffffff"/>
  <text x="250" y="25" font-size="9" fill="#7E8A84">Last 30 days</text>
  <!-- bar chart -->
  <g>
    <rect x="24" y="150" width="18" height="40" rx="4" fill="#D8DEF7"/>
    <rect x="50" y="120" width="18" height="70" rx="4" fill="#D8DEF7"/>
    <rect x="76" y="98" width="18" height="92" rx="4" fill="#2440C4"/>
    <rect x="102" y="132" width="18" height="58" rx="4" fill="#D8DEF7"/>
    <rect x="128" y="86" width="18" height="104" rx="4" fill="#2440C4"/>
    <rect x="154" y="110" width="18" height="80" rx="4" fill="#D8DEF7"/>
  </g>
  <!-- donut -->
  <g transform="translate(250,120)">
    <circle r="42" fill="none" stroke="#E7EAE1" stroke-width="16"/>
    <circle r="42" fill="none" stroke="#4E9A6B" stroke-width="16" stroke-dasharray="150 400" transform="rotate(-90)"/>
    <circle r="42" fill="none" stroke="#2440C4" stroke-width="16" stroke-dasharray="70 400" stroke-dashoffset="-150" transform="rotate(-90)"/>
    <text x="0" y="5" font-size="14" font-weight="700" fill="#14201C" text-anchor="middle">72%</text>
  </g>
  <!-- legend -->
  <g font-size="9" fill="#5A6660">
    <circle cx="210" cy="176" r="4" fill="#4E9A6B"/><text x="220" y="179">Active</text>
    <circle cx="210" cy="192" r="4" fill="#2440C4"/><text x="220" y="195">New</text>
  </g>
</svg>
